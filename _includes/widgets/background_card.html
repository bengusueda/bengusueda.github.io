<section class="my-3 p-3 bg-white shadow-sm rounded-xl" aria-labelledby="education-heading">
  <h2 id="education-heading" class="h6 mb-3"><i class="fas fa-graduation-cap" aria-hidden="true"></i> Education</h2>
  <div class="row">{% for item in site.data.profile.education %}<div class="col-lg-4 mb-3 mb-lg-0">
    <div class="small"><div class="font-weight-bold">{{ item.institution }}</div><div>{{ item.degree }}</div><div class="text-muted"><em>{{ item.dates }}</em></div><div class="text-muted mt-1">{{ item.detail }}</div></div>
  </div>{% endfor %}</div>
</section>
