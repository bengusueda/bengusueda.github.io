title: Bengü Süeda Şengül
name: Bengü Süeda Şengül
description: Materials Science and Engineering Ph.D. candidate at the University of Illinois Urbana-Champaign studying biomimetic membranes and soft matter.
url: https://bengusueda.github.io
baseurl: ""
repository: bengusueda/bengusueda.github.io
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
include:
  - _pages
exclude:
  - run.sh
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - CONTRIBUTING.md
  - README.md
  - LICENSE
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - assets/css/main.scss
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - assets/js/main.min.js
  - assets/js/collapse.js
  - assets/css/collapse.css
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
